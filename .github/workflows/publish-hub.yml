name: Publish committee workspace
on:
  push:
    branches: [main]
    paths: ['site/**', 'server/**', 'tools/**', '.github/workflows/publish-hub.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: committee-hub-pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    if: github.repository == 'swansea-isoc/committee-hub'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: hub_check
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate JavaScript and permission decisions
        run: |
          mkdir -p checks
          node --check site/workspace.js
          node --check site/config.js
          node --test tools/policy.test.mjs | tee checks/policy.txt
      - name: Verify disposable database schema and reminders
        env:
          PGPASSWORD: disposable-ci-password
        run: psql -h localhost -U postgres -d hub_check -f tools/database-check.sql | tee checks/database.txt
      - name: Install browser tools
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Test phone layouts and interfaces using synthetic API responses
        run: python tools/test_workspace.py
      - name: Upload only public frontend files for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Save check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committee-workspace-checks
          path: checks/
          retention-days: 7
  deploy:
    if: github.repository == 'swansea-isoc/committee-hub' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish workspace frontend
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment boundary
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## Committee workspace frontend published" >> "$GITHUB_STEP_SUMMARY"
          echo "Main entry: ${SITE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "This publishes static frontend files only, not the private backend." >> "$GITHUB_STEP_SUMMARY"
          echo "Google OAuth, the private database and storage, and email agent require separate activation and real-account testing. With empty configuration the app denies workspace access." >> "$GITHUB_STEP_SUMMARY"
